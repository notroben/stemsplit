[package]
name = "stemsplit"
version = "0.1.0"
description = "Local AI stem separator and synchronized DAW mixer"
authors = ["StemSplit"]
edition = "2021"

[lib]
name = "stemsplit_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
